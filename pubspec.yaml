name: board_arena
description: Ludo & Snakes and Ladders - online multiplayer board games with chat.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Firebase (online multiplayer + chat)
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.5
  firebase_auth: ^4.17.5

  # Utility
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

  # Emoji picker for chat
  emoji_picker_flutter: ^2.2.0

  # Sound effects (dice roll, capture, win)
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
